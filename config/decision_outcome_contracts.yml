version: 1

contracts:
  decision_intelligence.v_separation_fall_outcome_history:
    owner: analytics
    business_domain: decision_intelligence
    grain:
      - separation_id
    temporal_target: target_fall_before_conversion
    target_rules:
      source_of_truth: core.resultado_ciclo
      fall: 1
      converted: 0
      censored_open: null
      dated_competing_events_required: true
    conversion_interest_signal: conversion_interest_sample
    conversion_evidence:
      - fecha_pago_ci
      - pago_ci_marker_confirmado
      - monto_pago_ci_positivo
      - resultado_ciclo_venta
    post_outcome_fields:
      - motivo_caida_segun_asesor
      - cambio_de_departamento
      - depa_del_cambio
    requirements:
      post_outcome_fields_forbidden_in_live_features: true
      undated_payment_evidence_does_not_manufacture_temporal_label: true
      censored_open_rows_have_null_temporal_target: true
      current_payment_evidence_excludes_live_fall_risk: true
    notes:
      - A historical fall can later have payment evidence and still remain a valid fall-before-conversion label when CORE dated the fall first.
      - conversion_interest_sample is broader than the clean temporal target and must be analyzed separately.

  decision_intelligence.v_fall_reason_proforma_history:
    owner: analytics
    business_domain: decision_intelligence
    grain:
      - codigo_proforma
    purpose: historical_nlp_and_reason_taxonomy
    requirements:
      one_text_document_per_proforma: true
      only_confirmed_fall_outcomes: true
      live_feature_eligible: false
