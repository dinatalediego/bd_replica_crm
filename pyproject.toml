[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replica-redshift-local"
version = "0.2.0"
description = "Plataforma local Redshift -> PostgreSQL con capa de Decision Intelligence"
requires-python = ">=3.11,<3.13"
dependencies = [
  "redshift-connector>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
replica-cygnus = "replica_cygnus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
