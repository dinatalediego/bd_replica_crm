name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: absorption_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data platform
        run: python -m pip install -e ".[dev]"

      - name: Install decision engine
        run: python -m pip install -e "./decision_engine[dev]"

      - name: Compile Python
        run: python -m compileall -q src scripts decision_engine/src

      - name: Data platform tests
        env:
          ABSORCION_TEST_DSN: postgresql://postgres:synthetic_ci_only@localhost:5432/absorption_test
        run: python -m pytest tests

      - name: Decision engine tests
        run: python -m pytest decision_engine/tests

      - name: Parse governed YAML contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (
              Path("config/data_contracts.yml"),
              Path("config/decision_outcome_contracts.yml"),
              Path("config/tables.example.yml"),
              Path("decision_engine/config/decisions.yml"),
              Path("decision_engine/config/production_gates.yml"),
          ):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"OK {path}")
          PY
