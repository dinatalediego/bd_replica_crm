version: "0.1"
timezone: "America/Lima"
pilot_window:
  start: "2026-10-01"
  end: "2026-10-07"

status_order:
  - READY
  - CLAIMED
  - IN_PROGRESS
  - REVIEW_READY
  - REVIEWING
  - REWORK_REQUIRED
  - READY_FOR_HUMAN
  - BLOCKED
  - NEEDS_SCOPING
  - DONE
  - CANCELLED

tasks:
  - id: NIGHT-001
    date: "2026-10-01"
    priority: P0
    repo: dinatalediego/bd_replica_crm
    title: "Bootstrap Night Shift OS and restore green CI"
    status: IN_PROGRESS
    primary_agent: chatgpt
    reviewer: claude
    risk: LOW
    objective: "Create the governed overnight queue, policies, budgets, morning-report tooling, and fix the CI dependency gap that prevents tests from collecting."
    allowed:
      - edit_code
      - add_tests
      - update_docs
      - open_draft_pr
    forbidden:
      - merge_main
      - production_deploy
      - database_write
    acceptance:
      - "Night Shift YAML contracts parse"
      - "night_shift.py validation tests pass"
      - "root CI installs dependencies required by pricing_study tests"
      - "draft PR opened"
    next_action: "Finish implementation, run GitHub CI, and leave review-ready handoff."

  - id: NIGHT-002
    date: "2026-10-02"
    priority: P0
    repo: dinatalediego/bd_replica_crm
    title: "Medallio low-impact refresh health checks"
    status: READY
    primary_agent: chatgpt
    reviewer: claude
    risk: MEDIUM
    objective: "Audit the canonical refresh path for low-impact Redshift usage and add observability/tests without increasing source load."
